  <body>
    <canvas id="view"></canvas>
    <div id="ui"></div>
    <div id="debug"></div>
    <!-- Loading (W4): shown until the scene boots (main.ts removes it). Plain HTML: it paints before any JS. -->
    <div id="loading">
      <b>OKADA</b><span>LAGOS NIGHT RUN</span><i></i>
      <p class="tip" data-tips='[
        "Kicks are slow but send riders flying: aim them at the barrier.",
        "Boost refills while you ride. Save it for the Eko Bridge straight.",
        "Press jab early: the next one comes out the moment you can move.",
        "Rainy season: the road is slick. Brake earlier, turn wider.",
        "Time Trial: your ghost is your best run. Beat it, and it becomes the new ghost.",
        "Okadas are Lagos&apos; motorcycle taxis: the fastest way through go-slow traffic.",
        "Makoko, the village on the water, appears off the Third Mainland Bridge.",
        "Danfo: the yellow buses of Lagos. Don&apos;t rear-end one."
      ]'></p>
    </div>
    <script>
      // A tip, picked before the game's code arrives.
      const t = document.querySelector('#loading .tip');
      const tips = JSON.parse(t.dataset.tips);
      t.textContent = tips[Math.floor(Math.random() * tips.length)];
    </script>
