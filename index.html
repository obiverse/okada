    <script>
      // Loading (W4, D33): the city you ride, and a tip: about the game, about Africa's moto-taxis, about your city.
      (function () {
        var city = 'lagos';
        try { city = new URLSearchParams(location.search).get('city') || JSON.parse(localStorage.getItem('okada:settings') || '{}').city || 'lagos'; } catch (e) {}
        var titles = { lagos: 'LAGOS NIGHT RUN', douala: 'DOUALA · BENSKIN RUN' };
        var tips = {
          all: [
            'Kicks are slow but send riders flying: aim them at the barrier.',
            'Press jab early: the next one comes out the moment you can move.',
            'Rainy season: the road is slick. Brake earlier, turn wider.',
            'Time Trial: your ghost is your best run. Beat it, and it becomes the new ghost.',
            'From Lagos to Kampala, the moto-taxi has a hundred names: okada, benskin, zémidjan, boda boda.',
            'Cowries were money across West Africa for centuries, long before coins.'
          ],
          lagos: [
            'Okadas are Lagos\' motorcycle taxis: the fastest way through go-slow traffic.',
            'Makoko, the village on the water, appears off the Third Mainland Bridge.',
            'Danfo: the yellow buses of Lagos. Don\'t rear-end one.'
          ],
          douala: [
            'In Douala the moto-taxi is the benskin, from the Pidgin "bend skin": you lean in.',
            'Douala is one of the rainiest cities on Earth: keep your tyres on the paint.',
            'Makossa, the rhythm that took Cameroon to the world, was born in Douala.',
            'La Nouvelle Liberté at the Deïdo roundabout: 12 metres of the city\'s scrap, welded by Sumégné in 1996.',
            'Each year the Sawa people hold the Ngondo on the banks of the Wouri: canoe races, songs and dances.',
            'Zoua-zoua: fuel sold by the litre bottle at the roadside, for benskins that never stop.',
            'Douala\'s bendskin drivers are called the masters of the road: they know every shortcut in the city.',
            'Douala is home to people of some 240 ethnic groups: Cameroon in one city.'
          ]
        };
        var t = document.querySelector('#loading .tip'), list = tips.all.concat(tips[city] || [], tips[city] || []);
        t.textContent = list[Math.floor(Math.random() * list.length)];
        document.querySelector('#loading .load-city').textContent = titles[city] || titles.lagos;
      })();
